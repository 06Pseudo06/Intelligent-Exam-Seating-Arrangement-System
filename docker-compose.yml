services:
  # MySQL 8 Relational Database
  db:
    image: mysql:8.0
    container_name: exam_seating_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-exam_seating_db}
      MYSQL_USER: ${MYSQL_USER:-exam_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-exam_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/database/sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Node.js + C++ Allocation Engine Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: exam_seating_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-exam_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-exam_password}
      DB_NAME: ${MYSQL_DATABASE:-exam_seating_db}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5173},http://localhost:80,http://localhost:3000
      CPP_ALLOCATOR_BIN: /app/cpp-engine/allocator
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy

  # React 19 Frontend Dashboard
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-5000}/api
    container_name: exam_seating_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
